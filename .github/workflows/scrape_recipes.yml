name: Automated Recipe Scraper

on:
  workflow_dispatch:  # يتيح لك تشغيل السكربت يدوياً متى شئت من واجهة جيت هاب
  schedule:
    - cron: '0 0 * * *' # يتم تنفيذه يومياً بشكل تلقائي (اختياري)

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Control  # تحديد الفرع الخاص بك كما طلبته

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and push generated chunks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add recipe_chunks/
          git commit -m "Auto-update recipe chunks: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin Control
